services:
  mysql:
    image: mysql:8.0
    container_name: examforge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-examforge}
      MYSQL_USER: ${MYSQL_USER:-examforge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+08:00"]
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/examforge.sql:/docker-entrypoint-initdb.d/01-examforge.sql:ro
      - ./database/xxl-job.sql:/docker-entrypoint-initdb.d/02-xxl-job.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: examforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  namesrv:
    image: apache/rocketmq:5.3.2
    container_name: examforge-namesrv
    command: sh mqnamesrv
    environment:
      HEAP_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9876:9876"
    restart: unless-stopped

  broker:
    image: apache/rocketmq:5.3.2
    container_name: examforge-broker
    depends_on:
      - namesrv
    environment:
      NAMESRV_ADDR: ${ROCKETMQ_NAME_SERVER:-namesrv:9876}
      HEAP_OPTS: "-Xms1g -Xmx1g -XX:MaxDirectMemorySize=512m"
    command: sh mqbroker -n namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - rocketmq_data:/home/rocketmq/store
    restart: unless-stopped

  xxl-admin:
    image: xuxueli/xxl-job-admin:3.0.0
    container_name: examforge-xxl-admin
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
        --server.port=8080
        --server.servlet.context-path=/xxl-job-admin
        --xxl.job.accessToken=${XXL_JOB_TOKEN:?Set XXL_JOB_TOKEN in .env}
    ports:
      - "8088:8080"
    restart: unless-stopped

  api:
    image: examforge-backend:local
    build: ./backend
    container_name: examforge-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      broker:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: api
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-examforge}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-examforge}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      REDIS_HOST: redis
      ROCKETMQ_NAME_SERVER: ${ROCKETMQ_NAME_SERVER:-namesrv:9876}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      XXL_JOB_ADMIN: ${XXL_JOB_ADMIN_URL:-http://xxl-admin:8080/xxl-job-admin}
      XXL_JOB_TOKEN: ${XXL_JOB_TOKEN:?Set XXL_JOB_TOKEN in .env}
      LOADTEST_USERS_ENABLED: ${LOADTEST_USERS_ENABLED:-false}
      LOADTEST_USER_START: ${LOADTEST_USER_START:-1001}
      LOADTEST_USER_COUNT: ${LOADTEST_USER_COUNT:-1000}
      LOADTEST_USER_PASSWORD: ${LOADTEST_USER_PASSWORD:?Set LOADTEST_USER_PASSWORD in .env}
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    image: examforge-backend:local
    build: ./backend
    container_name: examforge-worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      broker:
        condition: service_started
      xxl-admin:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: worker
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-examforge}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER:-examforge}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      REDIS_HOST: redis
      ROCKETMQ_NAME_SERVER: ${ROCKETMQ_NAME_SERVER:-namesrv:9876}
      XXL_JOB_ADMIN: ${XXL_JOB_ADMIN_URL:-http://xxl-admin:8080/xxl-job-admin}
      XXL_JOB_TOKEN: ${XXL_JOB_TOKEN:?Set XXL_JOB_TOKEN in .env}
      XXL_JOB_EXECUTOR_IP: worker
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: examforge-web
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  rocketmq_data:
    name: examforge_rocketmq_data
